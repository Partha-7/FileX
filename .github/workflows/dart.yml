name: Build FileX APK

on:
  workflow_dispatch:
  push:
    branches:
      - dev

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check Flutter
        run: |
          flutter --version
          dart --version

      - name: Create Android project if missing
        run: |
          if [ ! -d "android" ]; then
            flutter create --platforms=android --org com.filex.app .
          fi

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload FileX APK
        uses: actions/upload-artifact@v4
        with:
          name: FileX-APK
          path: build/app/outputs/flutter-apk/app-release.apk
