name: filex
description: FileX document converter, scanner and PDF merger.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  file_picker: 10.3.8
  image_picker: ^1.2.3
  path_provider: ^2.1.5
  pdf_combiner: 5.0.0
  http: ^1.5.0
  open_filex: ^4.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
